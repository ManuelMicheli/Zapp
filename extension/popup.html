<!doctype html>
<meta charset="utf-8" />
<title>Zapp</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    width: 340px;
    margin: 0;
    padding: 16px;
    background: #0a0a0c;
    color: #fff;
    font:
      13px/1.4 -apple-system,
      Inter,
      system-ui,
      sans-serif;
  }
  .testata {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .marchio {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .stato {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #d3cbf8;
    background: rgba(197, 186, 244, 0.1);
    border: 1px solid rgba(197, 186, 244, 0.24);
  }
  .punto {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c5baf4;
    box-shadow: 0 0 8px rgba(197, 186, 244, 0.9);
  }
  .card {
    border-radius: 20px;
    overflow: hidden;
    background: #0e0e12;
    border: 1px solid rgba(197, 186, 244, 0.22);
  }
  .card img {
    display: block;
    width: 100%;
    height: 150px;
    object-fit: cover;
    background: #14121d;
  }
  .corpo {
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .titolo {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .meta {
    color: #8e8e93;
  }
  .tempo {
    margin-top: 6px;
    color: #8e8e93;
    font-variant-numeric: tabular-nums;
  }
  .barra {
    margin-top: 8px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.22);
    overflow: hidden;
  }
  .barra > div {
    height: 100%;
    border-radius: 999px;
    background: #c5baf4;
  }
  .diagnosi {
    margin: 10px 0 0;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    color: #8e8e93;
    font-size: 12px;
    line-height: 1.45;
  }
  .riga {
    margin: 0;
  }
  .vuoto {
    padding: 20px 4px;
    color: #8e8e93;
    line-height: 1.5;
  }
  .apri {
    display: block;
    margin-top: 14px;
    text-align: center;
    color: #d3cbf8;
    text-decoration: none;
    font-weight: 600;
  }
  .apri:hover {
    color: #e3defb;
  }
</style>
<div class="testata">
  <span class="marchio">Zapp</span>
  <span class="stato"><span class="punto"></span><span id="stato-testo">…</span></span>
</div>
<div id="contenuto"></div>
<a class="apri" id="apri-zapp" href="#" target="_blank" rel="noopener">Apri Zapp</a>
<script src="popup.js"></script>
