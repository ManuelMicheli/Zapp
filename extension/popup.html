<!doctype html>
<meta charset="utf-8" />
<title>Zapp</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    width: 340px;
    margin: 0;
    background: #0a0a0c;
    color: #fff;
    font:
      13px/1.4 -apple-system,
      Inter,
      system-ui,
      sans-serif;
  }

  /* Il guscio: la copertina sta qui dietro, a tutta finestra, e tutto il
     resto le sta sopra. Serve `isolation` perche' i due veli restino dietro
     al contenuto senza doverlo alzare uno per uno. */
  .guscio {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    padding: 16px;
  }
  .sfondo,
  .velo {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }
  /* La copertina si deve **riconoscere**: nitida, non un colore di fondo. La
     leggibilita' non la fa la sfocatura ma il velo qui sotto, che scurisce solo
     dove va il testo. */
  .sfondo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 32%;
  }
  /* Trasparente in alto (l'immagine si vede intera), nero in basso, dove stanno
     titolo, episodio e barra. Un velo uniforme o spegneva la copertina o
     lasciava il testo illeggibile: qui la transizione e' dove serve. */
  .velo {
    background: linear-gradient(
      180deg,
      rgba(10, 10, 12, 0.1) 0%,
      rgba(10, 10, 12, 0.28) 30%,
      rgba(10, 10, 12, 0.82) 62%,
      rgba(10, 10, 12, 0.96) 100%
    );
  }

  .testata {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .marchio {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  }
  .stato {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: #d3cbf8;
    background: rgba(20, 18, 29, 0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(197, 186, 244, 0.28);
  }
  .punto {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c5baf4;
    box-shadow: 0 0 8px rgba(197, 186, 244, 0.9);
  }
  /* In pausa il puntino smette di pulsare: si vede a colpo d'occhio. */
  .punto.vivo {
    animation: battito 2s ease-in-out infinite;
  }
  @keyframes battito {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.35;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .punto.vivo {
      animation: none;
    }
  }

  .corpo {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding-top: 118px; /* la copertina si vede sopra al testo */
  }
  .titolo {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.015em;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
  }
  .meta {
    color: rgba(255, 255, 255, 0.72);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
  }

  /* La barra del player: traccia sottile, riempimento accent, pallino in
     testa. Le due misure ai lati sono tabellari, altrimenti la cifra dei
     secondi fa ballare il testo a ogni scatto. */
  .player {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .traccia {
    position: relative;
    flex: 1;
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.28);
  }
  .riempimento {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 999px;
    background: #c5baf4;
    box-shadow: 0 0 10px rgba(197, 186, 244, 0.55);
  }
  .pallino {
    position: absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    margin-left: -4.5px;
    border-radius: 50%;
    background: #fff;
    transform: translateY(-50%);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }
  .tempo {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.78);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
    min-width: 38px;
  }
  .tempo.restante {
    text-align: right;
  }

  .diagnosi {
    margin: 12px 0 0;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    line-height: 1.45;
  }
  .vuoto {
    padding: 20px 4px;
    color: #8e8e93;
    line-height: 1.5;
  }
  .riga {
    margin: 0;
  }
  .apri {
    display: block;
    margin-top: 16px;
    text-align: center;
    color: #d3cbf8;
    text-decoration: none;
    font-weight: 600;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  }
  .apri:hover {
    color: #e3defb;
  }
</style>
<div class="guscio">
  <img id="sfondo" class="sfondo" alt="" hidden />
  <div id="velo" class="velo" hidden></div>
  <div class="testata">
    <span class="marchio">Zapp</span>
    <span class="stato"
      ><span id="punto" class="punto"></span><span id="stato-testo">…</span></span
    >
  </div>
  <div id="contenuto"></div>
  <a class="apri" id="apri-zapp" href="#" target="_blank" rel="noopener">Apri Zapp</a>
</div>
<script src="popup.js"></script>
