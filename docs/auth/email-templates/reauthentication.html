<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="supported-color-schemes" content="dark light" />
    <title>Zapp</title>
  </head>
  <body style="margin:0;padding:0;background:#050506;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <div style="display:none;font-size:1px;color:#050506;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">Il codice per confermare che sei tu.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#050506;">
      <tr>
        <td align="center" style="padding:24px 16px 48px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
            <tr>
              <td style="line-height:0;font-size:0;">
                <img src="https://zapp-mu.vercel.app/email/wall.gif" width="600" height="300" alt="Zapp" style="display:block;width:100%;max-width:600px;height:auto;border-radius:20px;" />
              </td>
            </tr>
            <tr>
              <!-- Nessuna scatola attorno al testo: sotto la testata il contenuto sta
                   direttamente sul fondo, come nel foglio di login. -->
              <td style="padding:30px 8px 0;">
                <div style="text-align:center;">
                  <h1 style="margin:0 0 12px;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-0.02em;color:#f5f5f7;">Confermi che sei tu?</h1>
                  <p style="margin:0 0 26px;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.62);">Inserisci questo codice in Zapp per completare l'operazione.</p>
                  <div style="font-size:34px;letter-spacing:10px;font-weight:600;color:#c5baf4;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;">{{ .Token }}</div>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 8px 0;font-size:12px;line-height:1.6;color:rgba(255,255,255,0.62);text-align:center;">
                Non hai chiesto tu questo codice? Ignora questa email.<br />
                <span style="color:#6b6b75;">Zapp &middot; i tuoi film e le tue serie, e dove guardarli</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
