<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zapp · Proposte profilo</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid #ffffff12}h1{font-size:24px;letter-spacing:-.8px;margin:0 0 10px}p{color:#8e8e93;font-size:14px;margin:0 0 20px}nav{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;font-size:14px;border:1px solid #ffffff24;border-radius:30px;background:#0e0e12;color:#fff;padding:12px 18px;cursor:pointer}button[aria-pressed=true]{background:linear-gradient(130deg,#c5baf438,#ffffff12);border-color:#c5baf46b}iframe{display:block;width:100%;height:calc(100vh - 190px);min-height:650px;border:0;color-scheme:dark}
</style></head><body><header><h1>Zapp · Il tuo profilo</h1><p>Tre proposte da “Le tue statistiche” in giù. Apri “Versione mobile” sotto ogni proposta. Dati dimostrativi.</p><nav aria-label="Scegli proposta"><button aria-pressed="true" data-src="desktop-a.html">A · Equilibrio cinematografico</button><button aria-pressed="false" data-src="desktop-b.html">B · Ritratto editoriale</button><button aria-pressed="false" data-src="desktop-c.html">C · Collezione</button></nav></header><iframe title="Proposta profilo Zapp" src="desktop-a.html"></iframe><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelector('iframe').src=b.dataset.src;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));</script></body></html>
