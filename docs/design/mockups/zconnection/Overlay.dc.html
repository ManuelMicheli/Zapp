<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #000000; color: #ffffff; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; display: flex; flex-direction: column;">

      </span>
    </div>
  </div>

  <div style="position: relative; flex-grow: 1; overflow: hidden; background: linear-gradient(160deg, #1a1626 0%, #0d0b13 48%, #050507 100%);">
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 32% 34%, rgba(197,186,244,0.16), rgba(0,0,0,0) 58%);"></div>

      <span style="position: relative; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.22); overflow: hidden;"><span style="position: absolute; inset: 0 auto 0 0; width: 23%; border-radius: 999px; background: rgba(255,255,255,0.85);"></span></span>
      <div style="display: flex; align-items: center; gap: 20px; color: rgba(255,255,255,0.6);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14M12 5v14"/><rect x="7" y="5" width="3" height="14" rx="1"/><rect x="14" y="5" width="3" height="14" rx="1"/></svg>
        <span style="font-size: 13px; font-variant-numeric: tabular-nums;">18:04 / 76:12</span>

    </div>

    <div style="position: absolute; right: 28px; bottom: 118px; display: flex; flex-direction: column; align-items: flex-end; gap: 12px;">

        <span style="position: relative; flex-shrink: 0;">
          <img src="poster-st.jpg" alt="" width="40" height="60" style="display: block; width: 40px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
          <span style="position: absolute; right: -6px; bottom: -6px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; color: #0a0a0c; background: #c5baf4; border: 2px solid rgba(28,28,30,0.9);">

          <span style="font-size: 12px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Stranger Things &middot; S4:E1</span>
        </span>
        <span style="font-size: 13px; font-weight: 600; color: #d3cbf8; flex-shrink: 0;">Annulla</span>

    </div>

</div>
